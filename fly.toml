# Fly.io: `fly launch --copy-config --no-deploy`, `fly volumes create emberfall_data --size 1`, `fly deploy`
app = "emberfall"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "emberfall_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.checks]
    [[http_service.checks.check]]
      path = "/health"
      interval = "30s"
      timeout = "5s"
